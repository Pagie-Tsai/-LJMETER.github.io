<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>俐準資料庫 | Lizhun Enterprise Database</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', 'Noto Sans TC', sans-serif; }
        
        /* 漸層光暈呼吸動畫 */
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.08); }
        }
        .animate-glow {
            animation: pulseGlow 6s ease-in-out infinite;
        }

        /* 上下漂浮動畫 */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }

        /* 漸顯動畫 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* 背景微網格紋理 */
        .bg-grid {
            background-image: radial-gradient(rgba(6, 182, 212, 0.15) 1px, transparent 1px);
            background-size: 32px 32px;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between relative overflow-x-hidden bg-grid">

    <!-- 背景動態光暈裝飾 -->
    <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-cyan-600/20 rounded-full blur-[140px] pointer-events-none animate-glow"></div>

    <!-- 頂部導覽列 (帶漸顯動畫) -->
    <header class="w-full max-w-7xl mx-auto px-6 py-8 flex justify-between items-center z-10 animate-fade-in">
        <div class="flex items-center space-x-3 group cursor-pointer">
            <div class="w-11 h-11 bg-gradient-to-tr from-cyan-600 to-cyan-400 rounded-2xl flex items-center justify-center shadow-lg shadow-cyan-500/30 group-hover:scale-105 transition duration-300">
                <span class="text-slate-950 font-black text-xl">俐</span>
            </div>
            <div>
                <h1 class="text-lg font-bold tracking-wider text-white">俐準資料庫</h1>
                <p class="text-[10px] text-cyan-400 font-medium tracking-widest uppercase">Lizhun Enterprise Database</p>
            </div>
        </div>
        <div class="flex items-center space-x-2 bg-slate-900/80 border border-slate-800 px-4 py-2 rounded-full backdrop-blur-md shadow-sm">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span>
            <span class="text-xs text-slate-300 font-medium">系統在線運行中</span>
        </div>
    </header>

    <!-- 主視覺 Hero 區域 -->
    <main class="w-full max-w-5xl mx-auto px-6 py-12 flex flex-col items-center text-center z-10 my-auto">
        
        <!-- 標籤動畫 -->
        <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 text-xs font-semibold tracking-wide mb-8 animate-fade-in shadow-lg shadow-cyan-500/10">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
            新一代智能工程與知識中樞系統
        </div>

        <!-- 主標題動畫 -->
        <h2 class="text-4xl sm:text-6xl md:text-7xl font-extrabold text-white tracking-tight mb-6 animate-fade-in leading-tight" style="animation-delay: 0.2s;">
            精準數據，<br>
            <span class="bg-gradient-to-r from-cyan-400 via-teal-300 to-blue-500 bg-clip-text text-transparent">引領智造未來</span>
        </h2>

        <!-- 副標題動畫 -->
        <p class="text-sm sm:text-base text-slate-400 max-w-2xl mb-12 animate-fade-in leading-relaxed" style="animation-delay: 0.4s;">
            結合高效能 AI 智慧解析與全方位工程知識管理，為現代製造業與研發團隊打造頂級的數位化數據中樞。
        </p>

        <!-- 動態按鈕與互動區 -->
        <div class="flex flex-col sm:flex-row gap-4 w-full justify-center max-w-md animate-fade-in" style="animation-delay: 0.6s;">
            <button onclick="handleEnter()" class="relative group overflow-hidden bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-semibold px-8 py-4 rounded-2xl transition duration-300 shadow-xl shadow-cyan-600/30 text-sm tracking-wide transform active:scale-95">
                <span class="relative z-10 flex items-center justify-center gap-2">
                    進入俐準資料庫
                    <svg class="w-4 h-4 group-hover:translate-x-1 transition duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </span>
            </button>
        </div>

        <!-- 漂浮特色卡片預覽 -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 w-full max-w-3xl mt-16 animate-float">
            <div class="bg-slate-900/60 border border-slate-800/80 p-5 rounded-2xl backdrop-blur-md text-left shadow-lg">
                <div class="text-cyan-400 font-bold text-lg mb-1">49+ 筆</div>
                <div class="text-xs text-slate-400">核心 DFMEA 專業知識庫</div>
            </div>
            <div class="bg-slate-900/60 border border-slate-800/80 p-5 rounded-2xl backdrop-blur-md text-left shadow-lg">
                <div class="text-cyan-400 font-bold text-lg mb-1">&lt; 0.5s</div>
                <div class="text-xs text-slate-400">極速智慧語意檢索反應</div>
            </div>
            <div class="bg-slate-900/60 border border-slate-800/80 p-5 rounded-2xl backdrop-blur-md text-left shadow-lg">
                <div class="text-cyan-400 font-bold text-lg mb-1">24 / 7</div>
                <div class="text-xs text-slate-400">工程智慧對話助理在線</div>
            </div>
        </div>

    </main>

    <!-- 底部版權宣告 -->
    <footer class="w-full max-w-7xl mx-auto px-6 py-6 text-center text-xs text-slate-500 z-10 animate-fade-in" style="animation-delay: 0.8s;">
        Lizhun Enterprise Knowledge Database &copy; 2026. All Rights Reserved.
    </footer>

    <script>
        function handleEnter() {
            // 點擊後的過場動畫特效
            document.body.style.transition = 'opacity 0.6s ease';
            document.body.style.opacity = '0';
            setTimeout(() => {
                alert('歡迎進入「俐準資料庫」！');
                document.body.style.opacity = '1';
            }, 600);
        }
    </script>
</body>
</html>
