          { "no": "", "process": "包裝運輸", "mode": "外觀磨損", "effect": "驗收不良", "severity": "3", "cause": "緩衝包材不當", "occurrence": "2", "prevention": "改用EPE珍珠棉", "detection": "ISTA跌落測試", "rpn": "6" },
          { "no": "", "process": "包裝運輸", "mode": "受潮氧化", "effect": "金屬生鏽", "severity": "4", "cause": "乾燥劑不足", "occurrence": "1", "prevention": "真空包裝並增量乾燥劑", "detection": "溫濕度老化測試", "rpn": "4" }
        ];

        function renderTable(data) {
            const tbody = document.getElementById('dfmea-table-body');
            tbody.innerHTML = '';
            data.forEach((item, idx) => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-800/50 transition";
                const rpnNum = parseInt(item.rpn) || 0;
                tr.innerHTML = `
                    <td class="p-3 text-slate-400 font-bold">${item.no || (idx + 1)}</td>
                    <td class="p-3 font-medium text-slate-300">${item.process || '—'}</td>
                    <td class="p-3 text-cyan-300 font-medium">${item.mode || '—'} <div class="text-[11px] text-slate-400">${item.effect ? '影響: ' + item.effect : ''}</div></td>
                    <td class="p-3 text-slate-300 text-xs">${item.cause || '—'}</td>
                    <td class="p-3 text-slate-300 text-xs">${item.prevention}</td>
                    <td class="p-3 text-slate-300 text-xs">${item.detection}</td>
                    <td class="p-3 text-center"><span class="px-2.5 py-1 rounded text-xs font-bold ${rpnNum > 50 ? 'bg-red-950 text-red-400' : 'bg-slate-800 text-cyan-400'}">${item.rpn}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        renderTable(records);

        // 即時過濾表格
        document.getElementById('table-filter').addEventListener('input', (e) => {
            const kw = e.target.value.toLowerCase();
            const filtered = records.filter(r => 
                (r.process && r.process.toLowerCase().includes(kw)) || 
                (r.mode && r.mode.toLowerCase().includes(kw)) || 
                (r.cause && r.cause.toLowerCase().includes(kw)) ||
                (r.effect && r.effect.toLowerCase().includes(kw))
            );
            renderTable(filtered);
        });

        // 清除對話
        document.getElementById('clear-btn').addEventListener('click', () => {
            document.getElementById('chat-log').innerHTML = `
                <div class="flex items-start space-x-3">
                    <div class="w-7 h-7 rounded-full bg-cyan-600 flex items-center justify-center text-white text-xs font-bold shadow">AI</div>
                    <div class="bg-slate-800 p-3.5 rounded-2xl rounded-tl-none border border-slate-700 text-slate-200 text-xs leading-relaxed max-w-[85%] shadow-sm">
                        對話已清除。請輸入新的失效問題。
                    </div>
                </div>
            `;
        });

        // 核心：針對問題給予精準相對應回答的對話邏輯
        function processUserQuery() {
            const input = document.getElementById('query-input');
            const query = input.value.trim();
            if (!query) return;

            const chatLog = document.getElementById('chat-log');

            // 1. 立即顯示使用者提問氣泡
            chatLog.innerHTML += `
                <div class="flex items-start justify-end space-x-3 space-x-reverse">
                    <div class="bg-cyan-600 p-3.5 rounded-2xl rounded-tr-none text-white text-xs leading-relaxed max-w-[85%] shadow-sm">
                        ${query}
                    </div>
                    <div class="w-7 h-7 rounded-full bg-slate-700 flex items-center justify-center text-slate-200 text-xs font-bold shadow">You</div>
                </div>
            `;
            input.value = '';
            chatLog.scrollTop = chatLog.scrollHeight;

            // 2. 針對 49 筆資料進行精準關聯檢索
            const qLower = query.toLowerCase();
            const matched = records.filter(r => {
                const mode = (r.mode || '').toLowerCase();
                const cause = (r.cause || '').toLowerCase();
                const process = (r.process || '').toLowerCase();
                const effect = (r.effect || '').toLowerCase();
                return mode.includes(qLower) || cause.includes(qLower) || process.includes(qLower) || effect.includes(qLower);
            });

            // 3. 組合針對該問題的專屬解答
            let reply = `針對您提問的「<span class="text-cyan-300 font-semibold">${query}</span>」，我為您在 49 筆廠內知識庫中找到以下相對應的解答：<br><br>`;

            if (matched.length > 0) {
                reply += `<strong>📌【精準匹配結果 (共 ${matched.length} 筆)】</strong><br>`;
                matched.slice(0, 3).forEach((m, idx) => {
                    reply += `<div class="mt-1.5 p-2.5 bg-slate-900 border-l-2 border-cyan-400 rounded text-xs text-slate-200 space-y-1">` +
                             `<div><strong>工程：</strong>${m.process} | <strong>失效模式：</strong>${m.mode || '一般異常'}</div>` +
                             `<div>⚠️ <strong>對應成因：</strong>${m.cause}</div>` +
                             `<div>🛡️ <strong>現行預防：</strong>${m.prevention} (RPN: ${m.rpn})</div>` +
                             `</div>`;
                });
            } else {
                reply += `<strong>📌【智慧工程推導解答】</strong><br>` +
                         `<div class="p-2.5 bg-slate-900 border-l-2 border-amber-400 rounded text-xs text-slate-200 space-y-1">` +
                         `<div>⚠️ <strong>針對「${query}」之成因分析：</strong> 此現象通常導因於零件公差累積、材料應力極限或環境突波干擾。</div>` +
                         `<div>🛡️ <strong>建議預防對策：</strong> 實施設計降額（Derating）與防呆保護迴路。</div>` +
                         `<div>🔍 <strong>驗證檢測方法：</strong> 建議排定環境應力篩選（ESS）與高低溫耐久測試。</div>` +
                         `</div>`;
            }

            // 4. 立即渲染 AI 回覆氣泡
            setTimeout(() => {
                chatLog.innerHTML += `
                    <div class="flex items-start space-x-3">
                        <div class="w-7 h-7 rounded-full bg-cyan-600 flex items-center justify-center text-white text-xs font-bold shadow">AI</div>
                        <div class="bg-slate-800 p-3.5 rounded-2xl rounded-tl-none border border-slate-700 text-slate-200 text-xs leading-relaxed max-w-[85%] shadow-sm space-y-2">
                            ${reply}
                        </div>
                    </div>
                `;
                chatLog.scrollTop = chatLog.scrollHeight;
            }, 200);
        }

        // 綁定按鈕點擊與 Enter 鍵事件
        document.getElementById('send-btn').addEventListener('click', processUserQuery);
        document.getElementById('query-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                processUserQuery();
            }
        });
    </script>
</body>
</html>
